<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>База знаний</title>

    <link href="./styles.css" rel="stylesheet" />
  </head>
  <body>
  <header>
    <h1 class="text-center text-5xl font-bold underline">База знаний</h1>
  </header>

  <main class="flex flex-col items-center justify-center ml-auto mr-auto">
    <section>
      <button type="button" onclick="loadArticles()">Обновить</button>
    </section>

    <section id="articles" class="flex flex-wrap gap-6 justify-center mt-8">
    </section>

    <section>
      <div class="text-center">
        <h2 class="text-3xl font-extrabold tracking-tight text-gray-900 dark:text-slate-200 sm:text-4xl">
          Добавление статьи
        </h2>
      </div>
      <div class="mt-12">
        <form class="grid grid-cols-1 gap-y-6 sm:grid-cols-2 sm:gap-x-8" id="formInput">
          <div class="sm:col-span-2">
            <label for="title" class="block text-sm font-medium text-gray-700 dark:text-slate-400">Название</label>
            <div class="mt-1">
              <input name="title" type="text" id="title" autocomplete="organization" required="" class="border border-gray-300 block w-full rounded-md py-3 px-4 shadow-sm focus:border-sky-500 focus:ring-sky-500 dark:border-white/5 dark:bg-slate-700/50 dark:text-white">
            </div>
          </div>
          <div class="sm:col-span-2">
            <label for="content" class="block text-sm font-medium text-gray-700 dark:text-slate-400">Содержание статьи</label>
            <div class="mt-1">
              <textarea required="" name="content" id="content" rows="4" class="border border-gray-300 block w-full rounded-md py-3 px-4 shadow-sm focus:border-sky-500 focus:ring-sky-500 dark:border-white/5 dark:bg-slate-700/50 dark:text-white"></textarea>
            </div>
          </div>
          <div class="flex justify-end sm:col-span-2">
            <button type="submit" class="inline-flex items-center rounded-md px-4 py-2 font-medium focus:outline-none focus-visible:ring focus-visible:ring-sky-500 shadow-sm sm:text-sm transition-colors duration-75 text-sky-500 border border-sky-500 hover:bg-sky-50 active:bg-sky-100 disabled:bg-sky-100 dark:hover:bg-gray-900 dark:active:bg-gray-800 dark:disabled:bg-gray-800 disabled:cursor-not-allowed">
              <span>Сохранить</span>
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="./index.js"></script>
  </body>
</html>
